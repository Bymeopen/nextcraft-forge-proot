name: Screenshots

# Press "Run workflow" (Actions > Screenshots) to render the main screens at the phone sizes the app targets and
# download them as an artifact. Not part of the normal CI: it needs the Robolectric SDK and takes longer.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "render = only draw the screens; compare = fail if a screen changed against the committed baselines; record = also produce new baselines (download the 'baselines' artifact and commit it)"
        type: choice
        options: [render, compare, record]
        default: render

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screens at phone sizes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.8.2"
      - name: Render screenshots
        run: gradle --no-daemon :app:testDebugUnitTest -PforgeScreenshots -PforgeScreenshotMode=${{ inputs.mode || 'render' }} --tests "com.nextcraft.forge.ui.Shots*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: error
      # Changed pixels in red, only present when compare mode found a difference.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.mode == 'compare'
        with:
          name: screenshot-diffs
          path: app/build/screenshots/diff-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.mode == 'record'
        with:
          name: baselines
          path: app/src/screenshotTest/baselines/*.png
          if-no-files-found: error
