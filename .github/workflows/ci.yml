name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build debug APK and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # gradle/wrapper pins Gradle 9.8.2 (AGP 9.4 needs Gradle 9.x); setup-gradle provisions the same version for the `gradle` calls below.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.8.2"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      # Lint errors fail the build (the 4 existing ones are fixed); warnings are reported only.
      - name: Android Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Assemble debug APK
        # Same identity as release-debug.yml: one app, com.nextcraft.forge.proot, versionCode = minutes since the epoch.
        run: gradle --no-daemon :app:assembleDebug -PversionCode="$(($(date +%s) / 60))" -PversionName="1.0.${GITHUB_RUN_NUMBER}-forge"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-r8:
    # Builds the minified (R8) release variant without a signing key, so shrinking problems show up before a release.
    # The APK is unsigned and cannot be installed as is; it only proves that the release variant compiles and that R8
    # kept what the app resolves by name (JNI class, activities/services, BuildConfig).
    name: Release build (R8, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.8.2"
      - name: Assemble release APK (R8, unsigned)
        run: gradle --no-daemon :app:assembleRelease -PrequireNdk
      - name: Check R8 output
        run: |
          set -eu
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libforgespawn.so' || { echo "libforgespawn.so missing"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libzstd-jni' || { echo "zstd-jni native library missing"; exit 1; }
          unzip -l "$apk" | grep -q 'classes.dex' || { echo "classes.dex missing"; exit 1; }
          mapping=app/build/outputs/mapping/release/mapping.txt
          test -s "$mapping" || { echo "R8 mapping.txt missing: the release variant was not minified"; exit 1; }
          # Classes resolved by name must exist under their original names (kept by proguard-rules.pro).
          for c in com.nextcraft.forge.runtime.NativeSpawn com.nextcraft.forge.MainActivity \
                   com.nextcraft.forge.runtime.RuntimeExecutionService com.nextcraft.forge.runtime.RuntimeSetupService \
                   com.nextcraft.forge.BuildConfig; do
            grep -q "^$c -> $c:" "$mapping" || { echo "R8 renamed or removed $c"; exit 1; }
          done
          echo "R8 kept every class the app resolves by name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  rea:
    name: REA Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest capstone pyelftools unicorn frida
      # qemu-user and the arm64 cross compiler let the gdbstub tests run for real instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu gdb strace squashfs-tools cpio
      - name: REA tests
        run: PYTHONPATH=app/src/main/assets/rea python -m pytest rea-tests -q

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntax check
        run: |
          sh -n scripts/runtime-bundles/chroot-exec.sh
          sh scripts/test-chroot-reaper.sh
          sh -n scripts/runtime-bundles/unmount-chroot.sh
          for s in scripts/runtime-bundles/build-*.sh scripts/make-update-manifest.sh; do bash -n "$s"; done
      - name: Chroot supervisor rejects unsafe arguments
        run: |
          if sh scripts/runtime-bundles/chroot-exec.sh /tmp/r /tmp/w "/workspace/../../etc" /tmp/b 10000 true 2>/dev/null; then
            echo "accepted a traversal path"; exit 1
          fi
          if sh scripts/runtime-bundles/chroot-exec.sh /tmp/r /tmp/w "/workspace/ok" /tmp/b "1000;id" true 2>/dev/null; then
            echo "accepted a non-numeric uid"; exit 1
          fi
      - name: Shipped scripts match the copies in the repository
        run: python3 scripts/check-embedded-scripts.py
