<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="Inter,Arial,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="tile"><rect width="108" height="108" rx="26" fill="url(#bg)"/><rect x=".5" y=".5" width="107" height="107" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".18"/></g>
    <path id="spark" d="M0,-9 C1,-3 3,-1 9,0 C3,1 1,3 0,9 C-1,3 -3,1 -9,0 C-3,-1 -1,-3 0,-9Z"/>
  </defs>
  <rect width="920" height="520" fill="#27272A"/>
  <text x="40" y="44" fill="#E5E7EB" font-size="20" font-weight="600">NextCraft Forge: pilihan logo</text>

  <!-- 1 -->
  <g transform="translate(40,70) scale(1.8)"><use href="#tile"/>
    <path d="M32,76 V34 L72,76 V34" fill="none" stroke="url(#g2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#spark" transform="translate(80,28) scale(1.1)" fill="#FBBF24"/>
  </g>
  <text x="40" y="288" fill="#E5E7EB" font-size="15">1. Monogram N + spark</text>

  <!-- 2 -->
  <g transform="translate(260,70) scale(1.8)"><use href="#tile"/>
    <path d="M32,36 L52,54 L32,72" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".6" filter="url(#glow)"/>
    <path d="M32,36 L52,54 L32,72" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58,72 H78" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="260" y="288" fill="#E5E7EB" font-size="15">2. Prompt &gt;_ (rekomendasi)</text>

  <!-- 3 -->
  <g transform="translate(480,70) scale(1.8)"><use href="#tile"/>
    <path d="M24,44 H78 Q84,44 84,50 H72 Q70,58 64,60 V66 H72 V74 H38 V66 H46 V60 Q40,58 38,50 H34 Q26,50 24,44Z" fill="url(#g)"/>
    <use href="#spark" transform="translate(62,28)" fill="#FBBF24"/>
  </g>
  <text x="480" y="288" fill="#E5E7EB" font-size="15">3. Anvil + spark</text>

  <!-- 4 -->
  <g transform="translate(700,70) scale(1.8)"><use href="#tile"/>
    <path d="M54,24 L77,37.5 V64.5 L54,78 L31,64.5 V37.5Z" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linejoin="round"/>
    <use href="#spark" transform="translate(54,51) scale(1.3)" fill="#34D399"/>
  </g>
  <text x="700" y="288" fill="#E5E7EB" font-size="15">4. Heksagon craft + spark</text>

  <!-- ukuran kecil -->
  <text x="40" y="370" fill="#9CA3AF" font-size="14">Pratinjau #2 pada ukuran kecil dan bentuk ikon berbeda</text>
  <g transform="translate(40,390)">
    <g transform="scale(1.0)"><use href="#tile"/><path d="M32,36 L52,54 L32,72" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M58,72 H78" stroke="#34D399" stroke-width="8" stroke-linecap="round"/></g>
    <g transform="translate(130,0) scale(.6)"><use href="#tile"/><path d="M32,36 L52,54 L32,72" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M58,72 H78" stroke="#34D399" stroke-width="8" stroke-linecap="round"/></g>
    <g transform="translate(210,0)"><clipPath id="c"><circle cx="54" cy="54" r="54"/></clipPath><g clip-path="url(#c)"><rect width="108" height="108" fill="url(#bg)"/><path d="M32,36 L52,54 L32,72" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M58,72 H78" stroke="#34D399" stroke-width="8" stroke-linecap="round"/></g></g>
  </g>
</svg>
