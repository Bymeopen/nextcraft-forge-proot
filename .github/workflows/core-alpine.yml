name: Core Alpine

# Builds the Alpine (musl) Core bundle for the PRoot engine on a native ARM64 runner and audits what its tools do against
# Android's app seccomp allowlist. The archive is kept as an artifact; nothing is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version
        default: "2026.10.3"
  push:
    branches: ["ccr-**"]
    paths:
      - ".github/workflows/core-alpine.yml"
      - "scripts/runtime-bundles/build-core-alpine.sh"
      - "scripts/runtime-bundles/audit-alpine-rootfs.sh"
      - "scripts/runtime-bundles/audit-android-seccomp.py"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '2026.10.3' }}

jobs:
  core-alpine:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build Core (Alpine)
        run: sudo -E NEXTCRAFT_CORE_ALPINE_VERSION="$VERSION" NEXTCRAFT_OUT_DIR="$PWD/out" scripts/runtime-bundles/build-core-alpine.sh
      - name: Audit against Android seccomp
        run: sudo scripts/runtime-bundles/audit-alpine-rootfs.sh "out/nextcraft-core-alpine-arm64-$VERSION.tar.zst"
      - name: Size and SHA-256
        run: |
          cd out
          for f in *.tar.zst; do printf '%s  %s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c %s "$f")" "$f"; done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: nextcraft-core-alpine, path: out/*.tar.zst, compression-level: 0 }
