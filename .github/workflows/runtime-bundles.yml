name: Runtime bundles

# Builds every runtime bundle from official sources with the scripts in scripts/runtime-bundles and keeps them as
# workflow artifacts. Nothing is published: a maintainer downloads the artifacts, checks them and uploads them to a
# runtime-<version> release by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version
        default: "2026.10.2"
  push:
    branches: ["ccr-rename-pocket-nextcraft"]
    paths: [".github/workflows/runtime-bundles.yml", "scripts/runtime-bundles/**"]

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '2026.10.2' }}
  NEXTCRAFT_OUT_DIR: ${{ github.workspace }}/out

jobs:
  core:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: sudo -E NEXTCRAFT_CORE_VERSION="$VERSION" scripts/runtime-bundles/build-core-on-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: nextcraft-core, path: out/*.tar.zst, compression-level: 0 }

  python-dsh:
    needs: core
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: nextcraft-core, path: core }
      - name: Extract Core
        run: sudo mkdir -p /opt/core && sudo tar --zstd -xf core/*.tar.zst -C /opt/core
      - run: sudo -E NEXTCRAFT_CORE_ROOTFS=/opt/core NEXTCRAFT_PYTHON_BUNDLE_VERSION="$VERSION" scripts/runtime-bundles/build-python-bundle.sh
      - run: sudo -E NEXTCRAFT_CORE_ROOTFS=/opt/core NEXTCRAFT_DSH_BUNDLE_VERSION="$VERSION" scripts/runtime-bundles/build-dsh-in-chroot.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: nextcraft-python-dsh, path: out/*.tar.zst, compression-level: 0 }

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: NEXTCRAFT_CLAUDE_BUNDLE_VERSION="$VERSION" scripts/runtime-bundles/build-claude-from-official.sh
      - run: NEXTCRAFT_AGY_BUNDLE_VERSION="$VERSION" scripts/runtime-bundles/build-agy-from-official.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: nextcraft-agents, path: out/*.tar.zst, compression-level: 0 }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: NEXTCRAFT_ANDROID_BUNDLE_VERSION="$VERSION" scripts/runtime-bundles/build-android-bundle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: nextcraft-android, path: out/*.tar.zst, compression-level: 0 }

  checksums:
    needs: [core, python-dsh, agents, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: all, merge-multiple: true }
      - name: SHA-256 and sizes
        run: |
          cd all
          for f in *.tar.zst; do printf '%s  %s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c %s "$f")" "$f"; done | tee SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: SHA256SUMS, path: all/SHA256SUMS.txt }
