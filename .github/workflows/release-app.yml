name: Release app

# Builds a signed release APK and publishes it with update-manifest.json, which the in-app updater reads from
# releases/latest/download/update-manifest.json. Needs these repository secrets (same signing key as the installed app):
#   FORGE_KEYSTORE_BASE64, FORGE_KEYSTORE_PASSWORD, FORGE_KEY_ALIAS, FORGE_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.1
        required: true
      version_code:
        description: Android versionCode (must be higher than the installed build)
        required: true
      version_name:
        description: Version name shown to users, e.g. 1.0.1
        required: true
      notes:
        description: Release notes
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.8.2"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.FORGE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "FORGE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forge.keystore"
      - name: Build release APK
        env:
          FORGE_KEYSTORE_FILE: ${{ runner.temp }}/forge.keystore
          FORGE_KEYSTORE_PASSWORD: ${{ secrets.FORGE_KEYSTORE_PASSWORD }}
          FORGE_KEY_ALIAS: ${{ secrets.FORGE_KEY_ALIAS }}
          FORGE_KEY_PASSWORD: ${{ secrets.FORGE_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: gradle --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Prepare assets
        env:
          TAG: ${{ inputs.tag }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Reject anything that is not a plain tag / version before it reaches shell and gh.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Bad tag: $TAG"; exit 1; }
          # Gradle falls back to versionCode 100 for anything that is not an Int, which would publish a manifest no device accepts.
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && [ "$VERSION_CODE" -le 2147483647 ] || { echo "Bad version_code (1..2147483647)"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "Bad version_name"; exit 1; }
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          # An unsigned APK would fail the signature check in the updater on every device.
          case "$apk" in *unsigned*) echo "Release APK is unsigned"; exit 1;; esac
          mkdir -p dist
          cp "$apk" "dist/nextcraft-forge-$VERSION_NAME.apk"
          NEXTCRAFT_OUT_DIR=dist scripts/make-update-manifest.sh \
            "dist/nextcraft-forge-$VERSION_NAME.apk" "$VERSION_CODE" "$VERSION_NAME" "$TAG" release "$NOTES"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION_NAME: ${{ inputs.version_name }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Tag the commit that was built, not whatever the default branch points to when run from another ref.
          gh release create "$TAG" dist/*.apk dist/update-manifest.json --target "$GITHUB_SHA" \
            --title "NextCraft Forge $VERSION_NAME" --notes "$NOTES" --latest
