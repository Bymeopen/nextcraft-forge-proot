name: Release debug build

# Publishes the debug-signed APK (the "NextCraft Forge X" side-by-side build, shared debug key) as a rolling GitHub
# release (never marked "latest": that stays on the signed release) together with update-manifest.json, so
# Settings > "Periksa pembaruan aplikasi" can install it in place.
# Runs from the Actions tab (once this file is on the default branch) or when a push to ccr-parallel-chats has
# "[release]" in its commit message, so nothing is published by accident. One rolling release (tag dev-latest) is
# replaced each time; the versionCode grows with every run, which is what the updater compares with the installed build.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes
        required: false
        default: ""
  push:
    branches: [main, ccr-parallel-chats]

permissions:
  contents: write

# Two runs at once would delete and create the same rolling tag under each other.
concurrency:
  group: release-debug
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.8.2"
      - name: Compute version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}-forge" >> "$GITHUB_ENV"
          echo "TAG=dev-latest" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Prepare assets
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          mkdir -p dist
          cp "$apk" "dist/nextcraft-forge-debug-$VERSION_NAME.apk"
          NEXTCRAFT_PACKAGE=com.nextcraft.forge NEXTCRAFT_OUT_DIR=dist scripts/make-update-manifest.sh \
            "dist/nextcraft-forge-debug-$VERSION_NAME.apk" "$VERSION_CODE" "$VERSION_NAME" "$TAG" debug "$NOTES"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          # Rolling release: drop the previous one (and its tag) so the app always finds the newest build.
          gh release delete "$TAG" --cleanup-tag --yes || true
          # GitHub removes the old tag asynchronously. Creating the release under the same tag name right away can lose
          # that race: the late tag deletion turns the new release into a draft, and the app then finds no manifest (404).
          sleep 20
          gh release create "$TAG" dist/*.apk dist/update-manifest.json \
            --title "NextCraft Forge debug $VERSION_NAME" --notes "${NOTES:-Debug build $VERSION_NAME from $GITHUB_REF_NAME}" --latest=false \
            --target "$GITHUB_SHA"
          # Verify the release is really published and the manifest is served; publish it again if it became a draft.
          for attempt in 1 2 3 4; do
            sleep 20
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq "map(select(.tag_name==\"$TAG\"))[0].id")
            draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .draft)
            if [ "$draft" = "false" ]; then break; fi
            echo "Release $id is a draft (attempt $attempt); publishing it again"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest=false >/dev/null || true
          done
          # The debug build is never "latest": releases/latest must keep pointing at the signed release (release-app.yml),
          # otherwise release-signed installs would fetch a debug manifest they have to reject.
          code=$(curl -sL -o /dev/null -w '%{http_code}' "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/update-manifest.json")
          echo "update-manifest.json via releases/download/$TAG: HTTP $code"
          [ "$draft" = "false" ] && [ "$code" = "200" ]
