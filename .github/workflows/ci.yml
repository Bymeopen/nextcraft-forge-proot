name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build debug APK and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # The repository has no Gradle wrapper; AGP 9.4 needs Gradle 9.x.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "9.8.2"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      # versionCode grows with the run number so the in-app updater sees each main build as newer than the last.
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug -PversionCode=$((1000 + GITHUB_RUN_NUMBER)) -PversionName=1.0.0-proot.${GITHUB_RUN_NUMBER}
      # Private repos count artifacts against the account storage quota; a full quota must not turn a green build red.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
      # A public, login-free download: every green push to main refreshes the "debug-latest" pre-release. It is a
      # pre-release so releases/latest (which the in-app updater reads) keeps pointing at signed releases.
      - name: Publish debug APK to the debug-latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$apk" nextcraft-forge-proot-debug.apk
          sha256sum nextcraft-forge-proot-debug.apk > nextcraft-forge-proot-debug.apk.sha256
          notes="Debug build of ${GITHUB_SHA} (shared debug key; debug installs update to it from Settings)."
          NEXTCRAFT_OUT_DIR=. scripts/make-update-manifest.sh nextcraft-forge-proot-debug.apk \
            $((1000 + GITHUB_RUN_NUMBER)) "1.0.0-proot.${GITHUB_RUN_NUMBER}" debug-latest debug "$notes"
          assets="nextcraft-forge-proot-debug.apk nextcraft-forge-proot-debug.apk.sha256 update-manifest.json"
          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest $assets --clobber
            gh release edit debug-latest --notes "$notes" --prerelease
          else
            gh release create debug-latest $assets --title "Debug build (latest main)" --notes "$notes" --prerelease
          fi

  release-r8:
    # Builds the minified (R8) release variant without a signing key, so shrinking problems show up before a release.
    # The APK is unsigned and cannot be installed as is; it only proves that the release variant compiles and that R8
    # kept what the app resolves by name (JNI class, activities/services, BuildConfig).
    name: Release build (R8, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Assemble release APK (R8, unsigned)
        run: gradle --no-daemon :app:assembleRelease
      - name: Check R8 output
        run: |
          set -eu
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libforgespawn.so' || { echo "libforgespawn.so missing"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libzstd-jni' || { echo "zstd-jni native library missing"; exit 1; }
          unzip -l "$apk" | grep -q 'classes.dex' || { echo "classes.dex missing"; exit 1; }
          mapping=app/build/outputs/mapping/release/mapping.txt
          test -s "$mapping" || { echo "R8 mapping.txt missing: the release variant was not minified"; exit 1; }
          # Classes resolved by name must exist under their original names (kept by proguard-rules.pro).
          for c in com.nextcraft.forge.runtime.NativeSpawn com.nextcraft.forge.MainActivity \
                   com.nextcraft.forge.runtime.RuntimeExecutionService com.nextcraft.forge.runtime.RuntimeSetupService \
                   com.nextcraft.forge.BuildConfig; do
            grep -q "^$c -> $c:" "$mapping" || { echo "R8 renamed or removed $c"; exit 1; }
          done
          echo "R8 kept every class the app resolves by name"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  rea:
    name: REA Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest capstone pyelftools unicorn frida
      # qemu-user and the arm64 cross compiler let the gdbstub tests run for real instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu gdb strace squashfs-tools cpio
      - name: REA tests
        run: PYTHONPATH=app/src/main/assets/rea python -m pytest rea-tests -q

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntax check
        run: |
          sh -n scripts/runtime-bundles/proot-exec.sh
          for s in scripts/runtime-bundles/build-*.sh scripts/make-update-manifest.sh; do bash -n "$s"; done
      - name: PRoot supervisor rejects unsafe arguments
        run: |
          if sh scripts/runtime-bundles/proot-exec.sh /tmp/r /tmp/w "/workspace/../../etc" /tmp/b 10000 true 2>/dev/null; then
            echo "accepted a traversal path"; exit 1
          fi
          if NEXTCRAFT_PROOT=/bin/true sh scripts/runtime-bundles/proot-exec.sh /tmp/r /tmp/w "/workspace/ok" /tmp/b "1000;id" true 2>/dev/null; then
            echo "accepted a non-numeric uid"; exit 1
          fi
      - name: No root or su code paths
        run: |
          if grep -rnE '"su"|su -mm|su -c|execlp\("su"' app/src/main --include='*.kt' --include='*.c'; then
            echo "root/su code path found in a PRoot-only build"; exit 1
          fi
      - name: Shipped scripts match the copies in the repository
        run: python3 scripts/check-embedded-scripts.py
