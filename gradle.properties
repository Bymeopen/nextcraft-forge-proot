android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.daemon=false
org.gradle.workers.max=2
# CI runners have ~7 GB. Without this Gradle forks its build JVM with the 512 MB default, and dex merging
# (D8) runs out of heap intermittently as the app grows ("OutOfMemoryError: Java heap space").
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Kotlin 2.x (K2 + Compose compiler plugin) ran out of heap in compileDebugKotlin with the 2 GB daemon default.
kotlin.daemon.jvmargs=-Xmx3g
