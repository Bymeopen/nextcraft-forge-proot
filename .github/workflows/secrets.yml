name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Plain CLI instead of the licensed gitleaks-action; fixtures in scripts/verify-core-fixes.sh are allowlisted.
      - name: Run gitleaks
        run: |
          v=8.28.0
          base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          curl -sSfL -o "gitleaks_${v}_linux_x64.tar.gz" "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o "gitleaks_${v}_checksums.txt" "$base/gitleaks_${v}_checksums.txt"
          # Pinned digest of gitleaks_8.28.0_linux_x64.tar.gz; the release checksum file must agree with it.
          grep -q "^a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_${v}_linux_x64.tar.gz$" "gitleaks_${v}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${v}_checksums.txt"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
